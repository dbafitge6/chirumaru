name: Expand Store Taglines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install anthropic requests

      - name: Verify API keys
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          CONSULTANT_API_KEY: ${{ secrets.CONSULTANT_API_KEY }}
        run: |
          echo "✅ AIRTABLE_TOKEN: ${#AIRTABLE_TOKEN} chars"
          echo "✅ CONSULTANT_API_KEY: ${#CONSULTANT_API_KEY} chars"

      - name: Run expand_taglines script
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          CONSULTANT_API_KEY: ${{ secrets.CONSULTANT_API_KEY }}
        run: |
          echo "📋 Running tagline expansion script..."
          python3 scripts/expand_taglines.py

      - name: Upload log file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expansion-log
          path: logs/description_expansion_*.md
          retention-days: 7

      - name: Create job summary
        if: always()
        run: |
          if [ -f logs/description_expansion_*.md ]; then
            echo "## Tagline Expansion Result" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Log file generated:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat logs/description_expansion_*.md >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No log file generated" >> $GITHUB_STEP_SUMMARY
          fi
