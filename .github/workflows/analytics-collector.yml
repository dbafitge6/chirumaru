name: Analytics Collector

on:
  schedule:
    # 毎週日曜 9:00 JST (土曜 0:00 UTC)
    - cron: '0 0 * * 6'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    name: Collect Analytics Data
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv google-analytics-data google-auth

      - name: Install Node and Postiz CLI
        run: |
          npm install -g postiz

      - name: Create .env file
        run: |
          cat > .env << EOF
          INSTAGRAM_GRAPH_TOKEN=${{ secrets.INSTAGRAM_GRAPH_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID=${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GA4_PROPERTY_ID=${{ secrets.GA4_PROPERTY_ID }}
          GA4_MEASUREMENT_ID=${{ secrets.GA4_MEASUREMENT_ID }}
          GA4_SERVICE_ACCOUNT_KEY=${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
          POSTIZ_API_KEY=${{ secrets.POSTIZ_API_KEY }}
          EOF

      - name: Authenticate Postiz CLI
        run: |
          export POSTIZ_API_KEY=${{ secrets.POSTIZ_API_KEY }}
          postiz auth:status || echo "Postiz auth initialized"

      - name: Collect analytics
        run: |
          python scripts/collect_analytics.py

      - name: Commit and push results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.name "Analytics Bot"
          git config --local user.email "analytics@chirumaru.local"
          git add data/analytics.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Analytics: Update data/analytics.json"
            git push
          fi

      - name: Report status
        if: always()
        run: |
          echo "Analytics collection completed"
          echo "Check data/analytics.json for results"
