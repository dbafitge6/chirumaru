name: Memo Enrichment Pipeline

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  enrich-memos:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic requests

      - name: Run Memo Enrichment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python3 scripts/memo_enrichment.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: memo-enrichment-logs
          path: logs/memo_enrichment_*.md
          retention-days: 30

      - name: Report Summary
        if: always()
        run: |
          if [ -f logs/memo_enrichment_summary.json ]; then
            python3 -c "
              import json
              with open('logs/memo_enrichment_summary.json') as f:
                data = json.load(f)
            print(f'### Memo Enrichment Results')
            print(f'- Processed: {data.get(\"total_processed\", 0)}')
            print(f'- Verified: {data.get(\"verified_count\", 0)}')
            print(f'- Unverified: {data.get(\"unverified_count\", 0)}')
            " >> $GITHUB_STEP_SUMMARY
          fi
