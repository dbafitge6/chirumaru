name: Refresh Instagram Token (Weekly)

on:
  schedule:
    # 毎週月曜日 00:00 UTC (09:00 JST)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  refresh-token:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Refresh Instagram token
        env:
          INSTAGRAM_GRAPH_TOKEN: ${{ secrets.INSTAGRAM_GRAPH_TOKEN }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          ARTIFACT_DIR: instagram-token-artifact
        run: python3 scripts/refresh_instagram_token.py

      - name: Upload token artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-token
          path: instagram-token-artifact/
          retention-days: 14
          if-no-files-found: ignore

      - name: Create job summary
        if: success()
        run: |
          echo "✅ Instagram token exchange successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 **New long-lived token is ready (60 days valid)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next step (manual):**" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to this workflow run's Artifacts section" >> $GITHUB_STEP_SUMMARY
          echo "2. Download the \`instagram-token\` artifact" >> $GITHUB_STEP_SUMMARY
          echo "3. Open the file and copy the token" >> $GITHUB_STEP_SUMMARY
          echo "4. Update GitHub Secrets: \`INSTAGRAM_GRAPH_TOKEN\`" >> $GITHUB_STEP_SUMMARY
