name: Check Target Records

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Run check script
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          python3 scripts/check_target_records.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-records-info
          path: logs/target_records_info.md
          retention-days: 7

      - name: Create job summary
        if: always()
        run: |
          echo "## Target Records Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f logs/target_records_info.md ]; then
            echo "✅ Results:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat logs/target_records_info.md >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No results file generated" >> $GITHUB_STEP_SUMMARY
          fi
