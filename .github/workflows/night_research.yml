name: Night Research (Daily)

on:
  schedule:
    # 毎日 02:00 JST (17:00 UTC) に実行
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests python-dotenv google-analytics-data google-auth airtable

      - name: Run night research
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          INSTAGRAM_GRAPH_TOKEN: ${{ secrets.INSTAGRAM_GRAPH_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: "17841413170142085"
          GA4_PROPERTY_ID: "547703308"
        run: python scripts/night_research.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Night Research Bot"
          git add research-results/

          if git diff --cached --quiet; then
            echo "ℹ️  No changes to commit (skipping)"
            exit 0
          fi

          git commit -m "chore: update research results $(date -u +%Y-%m-%d)"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
